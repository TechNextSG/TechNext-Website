<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — TechNext Asia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #f0ece3;
  color: #1a1a2e;
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }

:root {
  --bg: #f0ece3;
  --white: #ffffff;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --text: #1a1a2e;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --plum: #6d2d7a;
  --handwriting: 'Caveat', cursive;
  --sans: 'DM Sans', sans-serif;
}

/* ===== NAV ===== */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(240,236,227,0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 0 6%;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav-logo { display: flex; align-items: center; flex-shrink: 0; }
.logo-img { height: 88px; width: auto; mix-blend-mode: multiply; }
.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
}
.nav-links a {
  font-size: 0.875rem;
  font-weight: 500;
  color: #475569;
  transition: color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--text); }
.nav-apply {
  padding: 9px 22px;
  background: var(--plum);
  color: #fff;
  border-radius: 100px;
  font-size: 0.82rem;
  font-weight: 600;
  font-family: var(--sans);
  transition: all 0.25s;
  white-space: nowrap;
}
.nav-apply:hover { background: #5a2568; transform: translateY(-1px); }
.nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.lang-switcher { display: flex; gap: 2px; background: rgba(0,0,0,0.06); border-radius: 8px; padding: 3px; }
.lang-btn { background: none; border: none; color: #94a3b8; font-size: 0.68rem; font-weight: 700; font-family: var(--sans); letter-spacing: 0.06em; padding: 4px 9px; border-radius: 5px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
.lang-btn.active { background: var(--blue); color: #fff; box-shadow: 0 1px 4px rgba(37,99,235,0.3); }
.lang-btn:hover:not(.active) { color: var(--text); background: rgba(0,0,0,0.05); }
.hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s; }
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

/* ===== PAGE HEADER ===== */
.page-header {
  padding: 80px 6% 60px;
  max-width: 1280px;
  margin: 0 auto;
}
.page-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--handwriting);
  font-size: 1.6rem;
  font-weight: 600;
  font-style: italic;
  color: var(--blue);
  margin-bottom: 1rem;
}
.page-label::before {
  content: '';
  display: inline-block;
  width: 28px; height: 3px;
  background: var(--blue);
  border-radius: 1px;
}
.page-title {
  font-family: var(--handwriting);
  font-size: clamp(2.4rem, 4vw, 3.8rem);
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 1rem;
}
.page-title .highlight {
  position: relative;
  display: inline-block;
  z-index: 0;
}
.page-title .highlight::after {
  content: '';
  position: absolute;
  left: 0; bottom: 4px;
  width: 100%; height: 10px;
  background: #fef08a;
  z-index: -1;
  border-radius: 3px;
}
.page-sub {
  font-size: 1rem;
  color: #475569;
  line-height: 1.75;
  max-width: 560px;
}

/* ===== GALLERY FILTERS ===== */
.gallery-filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding: 0 6%;
  max-width: 1280px;
  margin: 0 auto 3rem;
}
.filter-btn {
  padding: 8px 20px;
  border-radius: 100px;
  font-size: 0.8rem;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--text-muted);
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ===== GALLERY GRID ===== */
.gallery-wrap {
  padding: 0 6% 100px;
  max-width: 1280px;
  margin: 0 auto;
}
.gallery-grid {
  columns: 3;
  column-gap: 1.2rem;
}
.gallery-item {
  break-inside: avoid;
  margin-bottom: 1.2rem;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  display: block;
}
.gallery-item img {
  width: 100%;
  display: block;
  border-radius: 16px;
  transition: transform 0.4s ease;
}
.gallery-item:hover img { transform: scale(1.04); }

/* Placeholder boxes */
.gallery-placeholder {
  background: #111827;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.2s;
  break-inside: avoid;
  margin-bottom: 1.2rem;
  position: relative;
  overflow: hidden;
}
.gallery-placeholder:hover { background: #1e2d3d; }
.gallery-placeholder .ph-icon {
  width: 36px; height: 36px;
  opacity: 0.2;
}
.gallery-placeholder .ph-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}
.gallery-placeholder .ph-cat {
  font-size: 0.65rem;
  color: rgba(255,255,255,0.1);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ===== LIGHTBOX ===== */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 12px; object-fit: contain; }
.lightbox-close {
  position: absolute;
  top: 1.5rem; right: 1.5rem;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.2); }

/* ===== FOOTER ===== */
footer {
  background: var(--text);
  color: rgba(255,255,255,0.65);
  padding: 1rem 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.8rem;
}
.footer-brand { display: flex; align-items: center; }
.footer-logo-img { height: 36px; width: auto; filter: brightness(0) invert(1); }
.footer-copy { font-size: 0.78rem; }
.footer-links { display: flex; gap: 1.4rem; }
.footer-links a { font-size: 0.78rem; transition: color 0.2s; }
.footer-links a:hover { color: #fff; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .gallery-grid { columns: 2; }
}
@media (max-width: 768px) {
  .hamburger { display: flex; }
  .nav-links { display: none; }
  .nav-apply { display: none; }
  .nav-links.open {
    display: flex; flex-direction: column; position: fixed;
    top: 64px; left: 0; right: 0;
    background: rgba(240,236,227,0.98); backdrop-filter: blur(16px);
    padding: 1.5rem 5%; border-bottom: 1px solid rgba(0,0,0,0.07);
    z-index: 99; gap: 0;
  }
  .nav-links.open li { border-bottom: 1px solid rgba(0,0,0,0.05); }
  .nav-links.open a { display: block; padding: 1rem 0; font-size: 1rem; }
  .logo-img { height: 44px; }
  .lang-switcher { position: relative; background: none; padding: 0; gap: 0; border-radius: 0; }
  .lang-btn { display: none; }
  .lang-btn.active { display: inline-flex; align-items: center; gap: 3px; background: var(--blue); color: #fff; padding: 5px 10px; border-radius: 7px; font-size: 0.7rem; box-shadow: 0 1px 4px rgba(37,99,235,0.3); }
  .lang-btn.active::after { content: ' ▾'; font-size: 0.55rem; opacity: 0.85; }
  .lang-switcher.open { flex-direction: column; align-items: stretch; background: #fff; border-radius: 10px; padding: 4px; gap: 2px; box-shadow: 0 4px 20px rgba(0,0,0,0.14); min-width: 60px; }
  .lang-switcher.open .lang-btn { display: block; text-align: center; padding: 6px 10px; border-radius: 6px; color: var(--text-muted); font-size: 0.7rem; letter-spacing: 0.05em; }
  .lang-switcher.open .lang-btn.active { background: var(--blue); color: #fff; box-shadow: none; gap: 0; }
  .lang-switcher.open .lang-btn.active::after { display: none; }
  .lang-switcher.open .lang-btn:hover:not(.active) { background: rgba(0,0,0,0.05); color: var(--text); }
}
@media (max-width: 560px) {
  .gallery-grid { columns: 1; }
}
</style>

<script>
/* ===== TRANSLATIONS ===== */
const LANG = {
  en: {
    nav_about:'About', nav_gallery:'Gallery', nav_careers:'Careers', nav_contact:'Contact', nav_apply:'Book Now',
    page_label:'Gallery', page_h1a:'Life at', page_h1b:'TechNext',
    page_sub:'A look inside our team, our workspace, and the moments that make TechNext a great place to build.',
    gf_all:'All', gf_team:'Team', gf_office:'Office', gf_events:'Events', gf_work:'Work',
    footer_copy:'© 2025 TechNext Asia · technext.asia'
  },
  vn: {
    nav_about:'Về Chúng Tôi', nav_gallery:'Thư Viện', nav_careers:'Tuyển Dụng', nav_contact:'Liên Hệ', nav_apply:'Đặt Lịch',
    page_label:'Thư Viện', page_h1a:'Cuộc Sống Tại', page_h1b:'TechNext',
    page_sub:'Nhìn vào bên trong đội ngũ, không gian làm việc và những khoảnh khắc làm cho TechNext trở thành nơi tuyệt vời để xây dựng.',
    gf_all:'Tất Cả', gf_team:'Đội Ngũ', gf_office:'Văn Phòng', gf_events:'Sự Kiện', gf_work:'Công Việc',
    footer_copy:'© 2025 TechNext Asia · technext.asia'
  },
  ph: {
    nav_about:'Tungkol', nav_gallery:'Galeria', nav_careers:'Karera', nav_contact:'Makipag-ugnayan', nav_apply:'Mag-book',
    page_label:'Galeria', page_h1a:'Buhay sa', page_h1b:'TechNext',
    page_sub:'Isang sulyap sa loob ng aming team, workspace, at mga sandaling nagpapaganda ng TechNext bilang lugar para bumuo.',
    gf_all:'Lahat', gf_team:'Team', gf_office:'Opisina', gf_events:'Mga Event', gf_work:'Trabaho',
    footer_copy:'© 2025 TechNext Asia · technext.asia'
  },
  de: {
    nav_about:'Über Uns', nav_gallery:'Galerie', nav_careers:'Karriere', nav_contact:'Kontakt', nav_apply:'Termin Buchen',
    page_label:'Galerie', page_h1a:'Leben bei', page_h1b:'TechNext',
    page_sub:'Ein Blick in unser Team, unseren Arbeitsbereich und die Momente, die TechNext zu einem großartigen Ort zum Bauen machen.',
    gf_all:'Alle', gf_team:'Team', gf_office:'Büro', gf_events:'Events', gf_work:'Arbeit',
    footer_copy:'© 2025 TechNext Asia · technext.asia'
  }
};
function setLang(lang) {
  localStorage.setItem('tn_lang', lang);
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === lang));
  const t = LANG[lang];
  document.querySelectorAll('[data-k]').forEach(el => { if (t[el.dataset.k] !== undefined) el.textContent = t[el.dataset.k]; });
}
const _savedLang = localStorage.getItem('tn_lang');
if (_savedLang && LANG[_savedLang]) setLang(_savedLang);
function toggleMenu() {
  document.getElementById('navMenu').classList.toggle('open');
  document.getElementById('hamburger').classList.toggle('open');
}

function filterGallery(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.gallery-item').forEach(item => {
    item.style.display = (cat === 'all' || item.dataset.cat === cat) ? 'block' : 'none';
  });
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
